# ⚠️ ARQUIVO PÚBLICO — curto de propósito. O porquê está no repositório privado do projeto.
version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: gsr-backup_estado_1
      APP_PORT: 8099

  agendador:
    image: node:22-alpine
    user: "1000:1000"
    restart: unless-stopped
    mem_limit: 768m
    volumes:
      - /home/umbrel/gsr-backup:/app
    working_dir: /app
    command: sh /app/scripts/umbrel/rodar-diariamente.sh

  estado:
    image: node:22-alpine
    user: "1000:1000"
    restart: unless-stopped
    mem_limit: 128m
    volumes:
      # Só de leitura: a página mostra o estado, não mexe em nada.
      - /home/umbrel/gsr-backup:/app:ro
    working_dir: /app
    command: node scripts/umbrel/pagina-de-estado.mjs
