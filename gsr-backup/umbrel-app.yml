# O APLICATIVO QUE MANTÉM O BACKUP DE PÉ NO SERVIDOR DE CASA.
#
# ⚠️ ELE NÃO CARREGA O BACKUP DENTRO DE SI. Os programas do backup continuam morando em
# `/home/umbrel/gsr-backup` (junto com o `.backup.env`, que tem as chaves e NUNCA entra aqui —
# esta pasta vira um repositório PÚBLICO). O aplicativo só monta aquela pasta e roda o
# agendador que já existe. Trocar um programa do backup = copiar o arquivo para lá; não mexe
# nesta loja nem exige reinstalar nada.
#
# ⚠️ A VERSÃO ABAIXO É O QUE O UMBREL COMPARA para oferecer "atualizar". Mexeu no
# `docker-compose.yml` desta pasta → suba a versão, senão o servidor continua com a antiga.
manifestVersion: 1.1
id: gsr-backup
name: Backup GSR
tagline: O backup diário do Next Step, cifrado
category: files
version: "1.0.0"
port: 8099
description: >-
  Faz o backup diário do Next Step (GSR) às 03:00 de Brasília, cifrado, e entrega
  a cópia ao Nextcloud.


  Abrir este aplicativo mostra o estado do último backup: quando rodou, se deu
  certo, e quantas tabelas e arquivos foram copiados. Ele não mostra nada do
  conteúdo — só contagens.


  Se o agendador estiver parado, a página diz isso em vermelho.
releaseNotes: >-
  Primeira versão. Substitui o container solto e o serviço do sistema, que não
  sobreviviam a reiniciar a máquina.
developer: GSR — Global Supply Recruitment
website: https://www.gsrecruitment.com.br
submitter: GSR
submission: https://github.com/robertocoltro/gsr-umbrel-loja
repo: https://github.com/robertocoltro/gsr-umbrel-loja
support: https://www.gsrecruitment.com.br
gallery: []
dependencies: []
path: ""
