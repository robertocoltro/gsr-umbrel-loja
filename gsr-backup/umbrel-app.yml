manifestVersion: 1.1
id: gsr-backup
name: Backup GSR
tagline: O backup diário do Next Step, cifrado
category: files
version: "1.0.0"
port: 8099
description: >-
  Faz o backup diário do Next Step (GSR), cifrado, e o entrega para fora desta
  máquina.


  Abrir este aplicativo mostra o estado do último backup: quando rodou, se deu
  certo, e quantas tabelas e arquivos foram copiados. Ele não mostra nada do
  conteúdo — só contagens.


  Se o agendador estiver parado, a página diz isso em vermelho.
releaseNotes: >-
  Primeira versão.
developer: GSR — Global Supply Recruitment
website: https://www.gsrecruitment.com.br
submitter: GSR
submission: https://github.com/robertocoltro/gsr-umbrel-loja
